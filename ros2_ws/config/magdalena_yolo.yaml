# Parameters for the YOLO perception graph (cameraNode + inference_node).
#   ros2 run run_model_cpp_node cameraNode --ros-args --params-file ros2_ws/config/magdalena_yolo.yaml
#   ros2 run run_model_cpp_node inference_node --ros-args --params-file ros2_ws/config/magdalena_yolo.yaml
# Camera i of camera_topics drives /threshold<i+1> (coil i-1) through tools/valve_bridge.py.
camera_process_node:
  ros__parameters:
    # Magdalena-Camera topics (/camera_<last IP octet>/color/image_raw). Only camera_55 and
    # camera_56 are in Magdalena-Camera's cameras.yaml today: confirm the other three names.
    camera_topics:
      - /camera_55/color/image_raw
      - /camera_56/color/image_raw
      - /camera_57/color/image_raw
      - /camera_58/color/image_raw
      - /camera_59/color/image_raw
    rate_hz: 15.0
    # Crop applied before stretching to 320x96. Must reproduce the crop of the training
    # frames; -1 keeps the centred 320x96 window.
    roi_x: -1
    roi_y: -1
    roi_w: -1
    roi_h: -1

Yolo_InferenceNode_v2:
  ros__parameters:
    engine_path: best.engine          # plant_main.engine: E11 model (curated labels, blur/colour augmentation)
    max_batch_size: 5
    # p(plant) >= plant_threshold opens the valve. 0.3 (E12): night 91.1 % vs 89.7 % at 0.5, day 96.3 vs 96.1
    plant_threshold: 0.3
    # Pass-condition switch: while the median blur ratio of a camera's last blur_window frames
    # is below blur_threshold (blurred pass: night, long exposure), that camera is decided by
    # the fallback engine (plant_fallback.engine, trained on ExG labels). "" disables it.
    # blur_threshold was set on 320x94 crops cut without resizing: keep roi_w/roi_h at the
    # default 320x96 window, a resized crop lowers the ratio.
    fallback_engine_path: ""
    blur_threshold: 0.561
    blur_window: 30
